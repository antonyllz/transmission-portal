<!-- Splits a client card image into background / wordmark / symbol layers for the home logo animation.
     Open through the portal server (e.g. http://host:5454/tools/logo-split.html); the JSON with the
     layers (data URLs) and letter boundaries is printed on the page. -->
<!doctype html><meta charset="utf-8"><body>
<script>
/* Splits a client card JPG into: clean background (logo inpainted away),
   logo layers (white + alpha) and per-letter boundaries for the typing effect. */
var JOBS = [
  { name: 'amazon-leo', src: '../assets/images/amazon-leo-card.jpg', box: [90, 110, 500, 228], grow: 7, hf: .45, dim: 0, tex: [[0, -45], [0, 45], [-120, 0], [120, 0]] },
  { name: 'starlink',   src: '../assets/images/starlink-card.jpg',   box: [280, 100, 745, 335], grow: 11, hf: 1, dim: 0, tex: [[-240, 30], [240, 60], [0, 120]] }
];
function load(src) { return new Promise(function(r) { var i = new Image(); i.onload = function() { r(i); }; i.src = src; }); }

async function run(job) {
  var img = await load(job.src), W = img.width, H = img.height;
  var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  var cx = cv.getContext('2d'); cx.drawImage(img, 0, 0);
  var id = cx.getImageData(0, 0, W, H), px = id.data;
  var b = job.box, N = W * H, white = new Uint8Array(N);
  for (var y = b[1]; y < b[3]; y++) for (var x = b[0]; x < b[2]; x++) {
    var i = (y * W + x) * 4, mn = Math.min(px[i], px[i + 1], px[i + 2]), mx = Math.max(px[i], px[i + 1], px[i + 2]);
    if (mn > 150 && mx - mn < 70) white[y * W + x] = 1;
  }
  /* keep only big connected components (the logo), drop the white dots of the background */
  var lab = new Int32Array(N), keep = new Uint8Array(N), comp = 0;
  for (var s = 0; s < N; s++) {
    if (!white[s] || lab[s]) continue;
    comp++; var st = [s], list = []; lab[s] = comp;
    while (st.length) {
      var p = st.pop(); list.push(p);
      var py = (p / W) | 0, pxx = p % W;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d) {
        var nx = pxx + d[0], ny = py + d[1];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) return;
        var q = ny * W + nx; if (white[q] && !lab[q]) { lab[q] = comp; st.push(q); }
      });
    }
    if (list.length > 60) list.forEach(function(p) { keep[p] = 1; });
  }
  /* dilate 3px to also catch the anti-aliased edge */
  var mask = new Uint8Array(N);
  for (var y2 = 0; y2 < H; y2++) for (var x2 = 0; x2 < W; x2++) {
    if (!keep[y2 * W + x2]) continue;
    var gr = job.grow;
    for (var dy = -gr; dy <= gr; dy++) for (var dx = -gr; dx <= gr; dx++) {
      var yy = y2 + dy, xx = x2 + dx;
      if (yy >= 0 && xx >= 0 && yy < H && xx < W && dx * dx + dy * dy <= gr * gr) mask[yy * W + xx] = 1;
    }
  }
  /* inpaint: diffusion from the border inwards */
  var R = new Float32Array(N), G = new Float32Array(N), B = new Float32Array(N), idx = [];
  for (var k = 0; k < N; k++) { R[k] = px[k * 4]; G[k] = px[k * 4 + 1]; B[k] = px[k * 4 + 2]; if (mask[k]) idx.push(k); }
  /* initialise holes with the row average of unmasked neighbours to speed convergence */
  idx.forEach(function(k) { R[k] = G[k] = B[k] = -1; });
  for (var pass = 0; pass < 60; pass++) idx.forEach(function(k) {
    if (R[k] >= 0) return;
    var n = [k - 1, k + 1, k - W, k + W], sr = 0, sg = 0, sb = 0, c = 0;
    n.forEach(function(q) { if (q >= 0 && q < N && R[q] >= 0) { sr += R[q]; sg += G[q]; sb += B[q]; c++; } });
    if (c) { R[k] = sr / c; G[k] = sg / c; B[k] = sb / c; }
  });
  for (var it = 0; it < 400; it++) idx.forEach(function(k) {
    var n = [k - 1, k + 1, k - W, k + W], sr = 0, sg = 0, sb = 0, c = 0;
    n.forEach(function(q) { if (q >= 0 && q < N && R[q] >= 0) { sr += R[q]; sg += G[q]; sb += B[q]; c++; } });
    if (c) { R[k] = sr / c; G[k] = sg / c; B[k] = sb / c; }
  });
  /* high-frequency detail (dots / city lights) borrowed from an unmasked spot nearby */
  function blurAt(k, ch) { var y = (k / W) | 0, x = k % W, s = 0, c = 0; for (var dy = -3; dy <= 3; dy++) for (var dx = -3; dx <= 3; dx++) { var yy = y + dy, xx = x + dx; if (yy < 0 || xx < 0 || yy >= H || xx >= W) continue; s += px[(yy * W + xx) * 4 + ch]; c++; } return s / c; }
  idx.forEach(function(k) {
    var y = (k / W) | 0, x = k % W;
    for (var t = 0; t < job.tex.length; t++) {
      var sx = x + job.tex[t][0], sy = y + job.tex[t][1];
      if (sx < 0 || sy < 0 || sx >= W || sy >= H) continue;
      var q = sy * W + sx; if (mask[q]) continue;
      var hf = job.hf, dm = job.dim;
      R[k] += (px[q * 4] - blurAt(q, 0)) * hf - dm; G[k] += (px[q * 4 + 1] - blurAt(q, 1)) * hf - dm; B[k] += (px[q * 4 + 2] - blurAt(q, 2)) * hf - dm * .6;
      return;
    }
  });
  /* tiny grain so the filled area doesn't look airbrushed */
  var bg = cx.createImageData(W, H), bd = bg.data;
  for (var m = 0; m < N; m++) {
    var g = mask[m] ? (Math.random() - .5) * 3 : 0;
    bd[m * 4] = R[m] + g; bd[m * 4 + 1] = G[m] + g; bd[m * 4 + 2] = B[m] + g; bd[m * 4 + 3] = 255;
  }
  /* logo matte: how much whiter than the reconstructed background each pixel is */
  var lg = cx.createImageData(W, H), ld = lg.data, colA = new Float32Array(W), rowA = new Float32Array(H);
  for (var q2 = 0; q2 < N; q2++) {
    if (!mask[q2]) continue;
    var lum = (px[q2 * 4] + px[q2 * 4 + 1] + px[q2 * 4 + 2]) / 3, bl = (R[q2] + G[q2] + B[q2]) / 3;
    var a = Math.max(0, Math.min(1, (lum - bl) / Math.max(1, 255 - bl)));
    ld[q2 * 4] = ld[q2 * 4 + 1] = ld[q2 * 4 + 2] = 255; ld[q2 * 4 + 3] = Math.round(a * 255);
    if (a > .5) { colA[q2 % W] += 1; rowA[(q2 / W) | 0] += 1; }
  }
  /* split mark vs text: the widest empty row band inside the logo */
  var y0 = rowA.findIndex(function(v) { return v > .5; }), y1 = H - 1;
  while (y1 > 0 && rowA[y1] <= .5) y1--;
  var best = null, run0 = -1;
  for (var r = y0; r <= y1; r++) {
    if (rowA[r] <= .5) { if (run0 < 0) run0 = r; }
    else if (run0 >= 0) { if (!best || r - run0 > best[1] - best[0]) best = [run0, r]; run0 = -1; }
  }
  var split = best ? Math.round((best[0] + best[1]) / 2) : Math.round((y0 + y1) / 2);
  /* amazon: text on top, smile below; starlink: mark on top, text below */
  var textTop = job.name === 'amazon-leo';
  var textRange = textTop ? [y0, split] : [split, y1 + 1];
  function layer(ya, yb) {
    var L = cx.createImageData(W, H);
    for (var yy2 = ya; yy2 < yb; yy2++) for (var xx2 = 0; xx2 < W; xx2++) {
      var o = (yy2 * W + xx2) * 4; for (var c2 = 0; c2 < 4; c2++) L.data[o + c2] = ld[o + c2];
    }
    return L;
  }
  var text = layer(textRange[0], textRange[1]), mark = textTop ? layer(split, y1 + 1) : layer(y0, split);
  /* letter boundaries: empty columns inside the text band */
  var cols = new Float32Array(W);
  for (var yy3 = textRange[0]; yy3 < textRange[1]; yy3++) for (var xx3 = 0; xx3 < W; xx3++) cols[xx3] += text.data[(yy3 * W + xx3) * 4 + 3] > 128 ? 1 : 0;

  var letters = [], inL = false, sx = 0;
  for (var xx4 = 0; xx4 < W; xx4++) {
    var on = cols[xx4] > 0;
    if (on && !inL) { inL = true; sx = xx4; }
    if (!on && inL) { inL = false; letters.push([sx, xx4]); }
  }
  /* merge gaps narrower than 3px (inside a glyph) */
  var merged = [];
  letters.forEach(function(l) { var p = merged[merged.length - 1]; if (p && l[0] - p[1] < 3) p[1] = l[1]; else merged.push(l.slice()); });
  var tbox = [merged[0][0], textRange[0], merged[merged.length - 1][1], textRange[1]];
  function url(imgData, type) { var c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').putImageData(imgData, 0, 0); return c.toDataURL(type || 'image/png', .9); }
  return { name: job.name, W: W, H: H, bg: url(bg, 'image/jpeg'), text: url(text), mark: url(mark),
           letters: merged.map(function(l) { return +(l[1] / W * 100).toFixed(2); }), textBox: tbox,
           markBox: textTop ? [0, split, W, y1 + 1] : [0, y0, W, split] };
}
Promise.all(JOBS.map(run)).then(function(out) {
  var pre = document.createElement('pre'); pre.id = 'out'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
});
</script>
