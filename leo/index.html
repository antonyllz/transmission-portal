<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Amazon Leo · Network Status — Tely</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg?v=2"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="leo.css"/>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="bg-grid"></div><div class="bg-glow g1"></div><div class="bg-glow g2"></div></div>

  <header class="top">
    <div class="brand">
      <img src="../assets/images/logo-tely.jpg" alt="Tely"/>
      <span class="x">&times;</span>
      <span class="client">Amazon Leo</span>
      <span class="divider"></span>
      <span class="product">Network Status</span>
    </div>
    <div class="top-right">
      <span class="live"><i></i>Live</span>
      <span class="clock" id="clock">--:--:-- UTC</span>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="hero-left">
        <div class="overall" id="overall">
          <div class="ov-ring"><span></span></div>
          <div>
            <div class="ov-kicker">Current status</div>
            <h1 id="ov-title">Loading…</h1>
            <p id="ov-sub">Connecting to the monitoring feed</p>
          </div>
        </div>
        <div class="seg" id="site-filter" role="tablist" aria-label="Site">
          <button data-site="" class="sel" role="tab">All sites</button>
          <button data-site="SLZ501" role="tab">SLZ501 <em>Ocara, CE</em></button>
          <button data-site="CPV501" role="tab">CPV501 <em>Sanharó, PE</em></button>
        </div>
        <div class="kpis" id="kpis"></div>
      </div>
      <div class="map-card">
        <canvas id="map" aria-label="Map of the Amazon Leo sites and circuits"></canvas>
        <div class="map-legend">
          <span><i class="lg up"></i>Operational</span>
          <span><i class="lg warn"></i>Degraded</span>
          <span><i class="lg down"></i>Outage</span>
        </div>
        <div class="map-tip" id="map-tip"></div>
      </div>
    </section>

    <section>
      <div class="sec-head"><h2>Sites &amp; circuits</h2><span class="sec-note" id="sites-note"></span></div>
      <div class="sites" id="sites"></div>
    </section>

    <section>
      <div class="sec-head"><h2>Network events</h2><span class="sec-note">Last 90 days · times in UTC</span></div>
      <div class="events" id="events"></div>
    </section>
  </main>

  <footer class="foot">
    <span>Operated by <b>Tely</b> · Network Engineering — Transmission</span>
    <span id="updated">—</span>
  </footer>

  <div class="tip" id="tip"></div>

  <script src="map-dots.js"></script>
  <script src="leo.js"></script>
</body>
</html>
