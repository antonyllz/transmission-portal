services:
  transmission-portal:
    build: .
    image: transmission-portal:latest
    container_name: transmission-portal
    restart: unless-stopped
    ports:
      - "5454:5454"            # host:container — change the left side to use another port
    environment:
      TZ: UTC
      # ZBX_TOKEN: "set-a-long-random-token"   # optional; otherwise one is generated in the data volume
      # NMS_TOKEN: "..."   # Padtec NMS API token for the Amazon Leo Rx; or put it in ./data/nms-token.txt
    volumes:
      - ./data:/app/server/data
